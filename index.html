<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Efeitos Sonoros</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <h1>Efeitos Sonoros</h1>

    <div class="botoes">
      <button class="botao-efeito" data-audio="somSino" aria-label="Tocar sino">
        <span class="icone">🔔</span>
        <span class="texto">Sino</span>
      </button>

      <button class="botao-efeito" data-audio="somPalmas" aria-label="Tocar palmas">
        <span class="icone">👏</span>
        <span class="texto">Palmas</span>
      </button>

      <button class="botao-efeito" data-audio="somFogos" aria-label="Tocar fogos de artifício">
        <span class="icone">🎆</span>
        <span class="texto">Fogos</span>
      </button>
    </div>
  </main>

  <audio id="somSino" src="sino.mp3" preload="auto"></audio>
  <audio id="somPalmas" src="palmas.mp3" preload="auto"></audio>
  <audio id="somFogos" src="fogos.mp3" preload="auto"></audio>

  <script src="script.js"></script>
</body>
</html>
